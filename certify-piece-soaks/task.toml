artifacts = ["/app/soaks.csv"]

[task]
name = "afterquery/certify-piece-soaks"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Certifying a heat treatment from the logger's records is routine work for a
metallurgical laboratory technician or a heat-treatment quality engineer: each
piece's probe reading is corrected from its calibration certificate, and the
soak is the time the corrected temperature stayed at or above the soak
temperature, with its mean. The data is synthetic and was made truth first.
Two furnace loads of eight test pieces were heated, held and cooled, each piece
in its own place in the furnace and each probe reading that temperature with
its own calibration error, and the 16 sealed figures come from each
piece's own probe, corrected. The logger's records, 18472 lines, and its
channel schedule were written afterwards. The figures are exact and nothing is
computed at marking time.

The lab's note gives every rule the marking uses. Read literally it gets
7 of 16, because three logger channels are plainly not
recording degrees Celsius: one is in Fahrenheit, one in kelvin, and one writes
hundredths of a degree as whole numbers. Each is obvious on sight, each applies
in both loads, and each spoils at least two lines where only 1
may be wrong.

What decides the task is the channel schedule. In each load one pair of probe
leads was landed on the other's terminals - a thermocouple's on a resistance
probe's channel and the other way about - so 4 channels carry a
different piece from the one scheduled. One of the four also has an odd unit;
the other three record exactly as the note says. The scheduled reading fails
silently: a furnace channel is a furnace channel, and every piece still gets a
believable soak and mean. It costs 4 lines. No level shows it,
because no two places in a furnace are at the same temperature anyway and the
pieces of a pair sit a few degrees apart like any others. What differs is the
probe. A type K thermocouple's reading jitters from one ten seconds to the
next and a platinum resistance probe's hardly moves: set against the mean of
its two neighbours while the furnace is holding, the steadiest thermocouple
jitters 8.2 times as much as the least steady resistance probe. In each
load exactly one channel scheduled as a thermocouple is steady and one
scheduled as a resistance probe jitters. The piece list has to give each
probe's kind, because the two kinds are corrected differently; the note never
says how either kind behaves, and neither a count of readings above 840 nor
their mean ever looks at how one reading stands to the next.

tests/furnace_check.py measures all of this against the sealed figures and
refuses to pass otherwise: of 16 readings of the records the right
one gets 16 and the best other 14, against a bar of 15.
"""

solution_explanation = """
solution/certify.py reads only /app and writes /app/soaks.csv with the standard
library. It groups each load's records by channel and brings each channel to
degrees Celsius by the size of its largest reading. For each channel it takes
the middle distance of a reading from the mean of its two neighbours over the
hot part of the run, ranks the load's channels by it, and calls the steadier
ones resistance probes; where exactly two channels show the other kind of probe
from the piece scheduled on them, it exchanges their pieces. Each piece's
readings are then corrected by its own certificate - offset added for a
thermocouple, scale multiplied for a resistance probe - and the soak is the
count of corrected readings at or above 840.0 at ten seconds each, with their
mean. In the task's own container it gets 16 of 16.
"""

verification_explanation = """
The verifier reads /app/soaks.csv with the csv module and compares each piece's
soak_min within 0.5 and mean_soak_c within 0.3 with /tests/sealed.json; at most
1 of the 16 lines may be wrong. None of the agent's code
is imported or run. The sealed figures exist only in the verifier image, /tests
is mode 700 there, and the agent's container never mounts it. The tolerances
cover unit conversion and rounding and nothing else; the reference reproduces
every sealed figure exactly. The two pieces of a crossed pair differ by degrees in mean soak
temperature and by more than a minute of soak, so the scheduled reading gets
none of their four lines right by chance. Nothing in the agent's container
attests any figure and nothing has to balance; a certificate made on the
schedule as written is as self-consistent as the right one. The reward is
binary and is written to /logs/verifier/reward.txt on every path; an empty
container scores 0 and the reference scores 1. The generator is seeded and
shipped.
"""

category = "Science"
subcategory = "Heat Treatment"
tags = ["heat-treatment", "thermometry", "calibration", "data-cleaning", "python"]
expert_time_estimate_hours = 4
relevant_experience = """
Anyone who has run a furnace survey has found two probe leads on each other's
terminals, a logger channel left in Fahrenheit, and knows a thermocouple trace
from a resistance-probe trace by how much it fidgets.
"""

