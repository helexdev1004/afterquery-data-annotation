[task]
name = "afterquery/number-lining-defects"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Filing inspection defects under the constructor's ring numbers is real and
ordinary work. Tunnel asset engineers and the inspection contractors of metro
and water-tunnel owners do it after every principal inspection, because the
asset register, the as-built drawings and every later repair order speak in
painted ring numbers while an inspector walking the bore books what he sees by
chainage along his tape. The awkward parts of it here - an inspector who books
in feet, another in yards, a third who writes the clock position first, a fourth
who books kilometres - are the ones inspection sheets actually have in them
rather than invented ones.

The data is synthetic and was built truth first. 5 tunnels were driven
from both portals and lined with 2475 rings, each with its painted number and
its place in the ground, before anything was surveyed. The joint survey and the
walk-through inspection of 382 defects were written afterwards, the way
the survey team and five inspectors would have kept them. Every answer is
therefore exact by construction rather than a judgement made later, and the
records are static files, so nothing is computed at marking time.

Forty defects are each to be filed under a painted ring number, marked exactly,
and 36 of the 40 are enough. Naming one ring for all forty gets
1.

The arithmetic is not withheld. LINING.md gives all of it: how the tunnels were
driven, how each drive numbered its rings, what the joint survey booked and what
the inspection booked, which ring takes a defect on a joint, and the length of a
foot and of a yard. The work is in the doing. Each defect's chainage has to be found among the
2480 joints of the survey tapes and the ring it falls in turned into a
painted number, and the answer is a ring number rather than a quantity, so there
is nothing to fit and nothing to regress. Taking the records exactly as they
stand files 0 of 40.

Five things about the records have to be got from the records themselves. None
is written down anywhere, and each is settled by something in the records that
cannot be right otherwise.

The first is that one inspector books chainage in feet, so that his defects run
on to three times the length of his tunnel.

The second is that one inspector books chainage in yards, so that his defects
run on just beyond the far portal; a yard brings the furthest of them back
inside it, and a foot would leave the last two thirds of his tunnel bare.

The third is that one inspector writes the clock position before the chainage,
so that his chainages are whole numbers from one to twelve.

The fourth is that one inspector books chainage in kilometres, so that all his
defects lie in the first two metres of the tunnel.

The fifth is not any inspector's habit, and it is the one that decides the
task. Drive A numbered its rings from portal A and drive B from portal B, so the
number painted on the ring that stands so many rings along the tape depends on
which portal the tape was begun from. The survey team began each tunnel from
whichever portal had the access that week: 2 of the 5 tapes were
begun from portal A and the rest from portal B, and nothing in the records says
which. LINING.md says how the rings were numbered and how the tape was booked,
and says nothing of which portal a tape was zeroed at; what settles it is the
joint survey itself. Both drives were lined with rings a metre and a half wide,
but under two contracts from two casting yards, drive A's rings cast to two
millimetres and drive B's to nine. So along every tape the evenness of the
joints changes where the drives met: the rings on one side of the breakthrough
stray from the usual width at least 3.69 times as far as the rings on the
other, in every tunnel. And the two drives of a tunnel did not build the same number of
rings, so how many rings along the tape that change comes says which drive the
tape met first: in every tunnel it comes within 3 rings of the number
one drive built and no nearer than 45 rings to the number the other
built. Ring width itself says nothing - it is the same for both drives, so a
solver who works out the rings' widths sees one run of rings a metre and a half
wide from portal to portal. Taking every tape to run from portal A costs 24 of the 40
defects - and nothing goes visibly wrong for a solver who does. A defect is
found among the joints of the very tape it was booked on, so every defect falls
in a ring whichever portal the solver has in mind, and nothing in the inspection
can be set against anything that knows one portal from the other. Unlike the
four inspectors' habits, which can each be checked against the tunnel of the
inspector who kept to the note, there is no clean tunnel for this one.

tests/gates.py scores all 48 ways of reading those five. Every figure
quoted here comes from its output. The whole account files all 40. The
best account that is not the whole one files 32, so missing any single
one of them fails. 36 are needed, which leaves four defects of room for a
slip and still sits 4 clear of every partial account. It also refuses to
pass unless the joint survey really does settle which portal every tape was
begun from, since a reading the records did not settle would be a guess and not
a finding; and unless no wanted defect stands within four centimetres of a
joint, so that neither the rule for a defect on a joint nor a foot's rounding
decides an answer.
"""

solution_explanation = """
solution/number.py reads only what the agent's container carries and writes
/app/rings.tsv. With solution/lining.py and solution/ref.py it is under two
hundred and fifty lines and imports nothing outside the standard library.

It reads the tunnel list, the joint survey and the inspection, and finds the
inspectors' habits from the records rather than assuming them: the tunnel whose
chainages are whole numbers up to twelve while its clock positions run to
hundreds, the one whose defects all lie in the first two metres, and the two
whose defects run on beyond the last joint of the tape - in yards if a yard
brings the furthest defect back inside the far portal, and in feet if it takes a
foot. It puts each right, working in exact fractions and rounding
to the millimetre only at the end. For every tunnel it then finds how many rings
along the tape the evenness of the joints changes most sharply - how far the
rings before a point stray from the usual width, against how far the rings after
it do - and takes the
tape to have been begun from portal A if that number stands nearer the rings
drive A built than the rings drive B built, and from portal B otherwise. It
finds each defect's ring among the joints, a defect on a joint going to the ring
beyond it, and turns the ring's place along the tape into the painted number:
counting from portal A, the first rings are drive A's in order, and the rest are
drive B's counted back from portal B.

Every quantity is a whole number of millimetres once converted and every
comparison against a joint is made exactly, so nothing turns on floating point
and two correct implementations must agree to the ring. Run against the shipped
records it files 40 of 40.
"""

verification_explanation = """
The deliverable is a data file. The verifier reads /app/rings.tsv and never
executes, imports or loads anything the submission wrote, so there is nothing to
sandbox and no way for a submission to influence its own score.

40 answers are marked, one for each defect in wanted.txt, each a painted
ring number matched exactly as text. 36 must be right. The sealed numbers
live only in the verifier image at /tests/truth.json; the agent's container
carries the note, the tunnel list, the joint survey, the inspection and the list
of wanted defects, and nothing else. /tests is mode 700 in the verifier image,
set at build time so it holds under a read-only root, and the agent's container
has no mount of it at all; the verifier's log directory is likewise unreachable
from the agent's side.

There is nothing in the agent's container against which a solver could check an
answer. No defect's ring number is attested anywhere, no total has to come out
and nothing has to balance, so a wrong set of numbers is exactly as
self-consistent as the right one. The numbers have to be worked out; they cannot
be searched for.

tests/gates.py is shipped and can be re-run. It scores all 48 readings
of the records against the sealed numbers and refuses to pass if the whole
account does not file every defect, if any other account reaches the bar, or if
guessing does. It reports the whole account at 40, the best account that
is not it at 32, the records taken as they stand at 0, and
one ring named for everything at 1.

The records are static files from a seeded generator, so nothing is computed at
marking time and the answer cannot drift between runs. The reference was run
against the shipped bundle in the task's own container and filed 40 of
40; an empty container scores 0.
"""

category = "Operations"
subcategory = "Compliance"
tags = ["tunnelling", "asset-records", "record-forensics", "linear-referencing", "python"]
expert_time_estimate_hours = 5
relevant_experience = """
Anyone who has kept a tunnel's asset register will know the shape of this. The
register speaks in the ring numbers the constructor painted, two drives numbered
from two portals; the inspection speaks in chainage along a tape; and the sheets
are what five inspectors made them - feet, yards, kilometres, the clock written
first. Tying the one to the other is the classic
instance: the tape has to be laid against the rings, which means knowing which
portal it was run from, and the as-built lining says so to anyone who knows that
two drives seldom share a casting yard or a ring count. Reading a joint survey for
where the drives met is ordinary work for anyone who has reconciled tunnel
records.
"""

