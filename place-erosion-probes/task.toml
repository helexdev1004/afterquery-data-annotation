[task]
name = "afterquery/place-erosion-probes"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Putting an altitude and a surface on every observation after the fieldwork is
over is real and ordinary work. Geomorphologists and ecologists who walk a transect with a
measuring wheel and a voice recorder do it for every paper, and they do it from
exactly these leavings: the levelling of the path, its surface schedule, the
wheel's log, the recorder's time stamps and the protocol the fieldworkers were
given. The awkward
parts of it here - a wheel that counts feet, one that counts miles, a logger
that writes what was rolled in each ten seconds and not the running total, one
that writes seconds since the walk began and not the time of day - are the ones
field loggers actually have in them rather than invented ones.

The data is synthetic and was built truth first. 289 stations were
levelled on 5 paths and every probe given its place, and so its altitude
and its surface, before any walk was logged; the walks were then logged, 9050 lines of them,
the way five fieldworkers would have done it. Every answer is therefore exact by
construction rather than a judgement made later, and the records are static
files, so nothing is computed at marking time.

Forty readings are each to be given an altitude and a surface, right if the
altitude is within half a metre and the surface is the scheduled one, and at
most 4 may be wrong. No single altitude is right for more
than 2 of the forty.

The arithmetic is not withheld. FIELDWORK.md gives all of it: how a path is
levelled and its stations listed, how altitude runs between stations, how the
surfaces are scheduled, how the wheel and the recorder log, where a reading's place is, and the length of a
foot and a mile. The work is in the doing. Taking the logs exactly as they stand
gets 0 of 40.

Five things about the logs have to be got from the logs themselves. None is
written down anywhere, and each is settled by something in the records that
cannot be right otherwise.

The first is that one wheel counted feet, so that it rolled three and a quarter
times the length of its path.

The second is that one wheel counted miles, so that it rolled six or seven of
something on a path eleven kilometres long.

The third is that one logger wrote what the wheel rolled in each ten seconds and
not the running total, so that its distances go up and down and never pass
fifteen.

The fourth is that one logger wrote the seconds since the walk began and not the
time of day.

The fifth is not like them, and it is the one that decides the task. The
protocol sets the wheel to nought at the foot of the path, the end station
distances are reckoned from. 2 of the 5 walks were made from the
top down. Nothing in the records says which, and nothing breaks for a solver
who takes the protocol at its word: a wheel rolls the length of its path either
way, so every reading still falls on the path and gets an altitude. It is not
tied to the four habits either - one of the walks from the top has a habit and
the other is the walk of the fieldworker who otherwise kept to the protocol.
No pace settles it: these are railway grades, one or two in a hundred, and
nobody slows on them, so the pace in the logs follows nothing in the records,
and a check of pace against grade or against surface, from either end, shows
nothing. What settles it is the wheel. A measuring wheel
runs true on tarmac and chatters on ballast: its running total is right on
both, but the ground it covers from one ten seconds to the next is steady on
the one and ragged on the other. Take how far each ten seconds on the move
strays from the ten seconds either side of it, and take the middle value of
that on each surface: read from the right end the wheel chatters at least
2.9 times as much on ballast as on tarmac on every path, and read from
the wrong end the two come out about alike, lower by at least 2.0. It
is in no column and in no mean. The average pace on ballast is the average
pace on tarmac to within 4 in a hundred on every path from either
end, and the plain spread of the pace is mostly the walker's own - his pace
wanders, and now and then he has a minute of fuss at a gate or a puddle,
wherever he happens to be - so a table of mean and spread by surface says
nothing either way. The five paths are all different, so no walk can be laid
against another. Starting every walk at the foot costs 16
of the 40 readings, and starting every walk at the top costs 24.

tests/gates.py scores all 48 ways of reading those five. Every figure
quoted here comes from its output. The whole account gets all 40. The
best account that is not the whole one gets 32, so missing any single
one of them fails. At most 4 may be wrong, which leaves room for a slip
and still sits 4 clear of every partial account. It also refuses to pass
unless the walking really does settle which end every walk began at, since a
reading the records did not settle would be a guess and not a finding.
"""

solution_explanation = """
solution/level_probes.py reads only what the agent's container carries and
writes /app/probe_altitudes.jsonl. With solution/survey.py and solution/ref.py
it is under two hundred and fifty lines and imports nothing outside the standard
library.

It reads the levelling and the five wheel logs and finds each log's habit from
the log rather than assuming it: the log whose distances fall as well as rise,
the two whose last distance matches the length of the path only in feet or only
in miles, and the log whose times have no colons in them. It puts each right.
For every walk it then takes how far the ground covered in each ten seconds on
the move strays from the ten seconds either side of it, groups that by the
surface it fell on, and sets the middle value on ballast over the middle value
on tarmac - once reading the wheel from the foot and once from the top - and
keeps the end that gives the greater. It finds where the wheel stood when
each reading was spoken, turns that into a distance from the foot, and gets the
altitude from the two stations either side in proportion and the surface from
the schedule.

Distances are carried as whole millimetres and the proportion is exact, so
nothing turns on floating point. Run against the shipped records it gets
40 of 40.
"""

verification_explanation = """
The deliverable is a data file. The verifier reads /app/probe_altitudes.jsonl
as text, parses each line as JSON, and never executes, imports or loads anything
the submission wrote, so there is nothing to sandbox and no way for a submission
to influence its own score.

40 answers are marked, one for each reading in paper.txt, each right if
its altitude is within half a metre of the sealed one and its surface is the
same. The half metre is rounding
room and nothing more: every one of the forty was chosen so that any account of
the logs that gets something wrong puts it more than five metres out. At most
4 may be wrong. The sealed altitudes live only in the verifier image at
/tests/truth.json; the agent's container carries the protocol, the path list,
the levelling, the surface schedule, the wheel logs, the readings and the
paper's list, and nothing
else. /tests is mode 700 in the verifier image, set at build time so it holds
under a read-only root, and the agent's container has no mount of it at all; the
verifier's log directory is likewise unreachable from the agent's side.

There is nothing in the agent's container against which a solver could check an
answer. No reading's altitude is attested anywhere, no total has to come out and
nothing has to balance, so a wrong set of altitudes is exactly as
self-consistent as the right one. They have to be worked out; they cannot be
searched for.

tests/gates.py is shipped and can be re-run. It scores all 48 readings
of the records against the sealed altitudes and refuses to pass if the whole
account does not get every one, if any other account comes within the
allowance, or if guessing does. It reports the whole account at 40, the
best account that is not it at 32, and the logs taken as they stand
at 0.

The records are static files from a seeded generator, so nothing is computed at
marking time and the answer cannot drift between runs. The reference was run
against the shipped bundle in the task's own container and got 40 of
40; an empty container scores 0.
"""

category = "Science"
subcategory = "Geomorphology"
tags = ["field-survey", "data-cleaning", "record-forensics", "interpolation", "python"]
expert_time_estimate_hours = 5
relevant_experience = """
Anyone who has come home from a field season with a wheel log and a voice
recorder will know the shape of this. The protocol covers the ordinary case and
the logs are what five people made of it: feet, miles, increments where a
running total was wanted, a stopwatch where a clock was. Working out which end a
transect was walked from, when nobody wrote it down, is the classic instance -
somebody always gets dropped at the top - and that a measuring wheel chatters
on ballast and runs sweetly on tarmac is ordinary knowledge for anyone who has
pushed one.
"""

