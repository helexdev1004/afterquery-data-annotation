[task]
name = "afterquery/total-clerk-commission"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Reckoning counter staff's commission from the order book is quarter-end work
for an accounts assistant or payroll clerk at any trade merchant: class each
order from what the clerk wrote, apply the rate, take off the credit notes, and
total by clerk and month. The data is synthetic and was made truth first. A
quarter of 3109 orders and 309 credit notes was generated person by
person, each written in that clerk's own hand, and the 18 sealed figures
are what each person really earned. The books were exported afterwards, as the
counter system keeps them. The figures are exact and nothing is computed at
marking time.

The accounts note gives every rule used in marking. The plain obstacle is the
writing. Six clerks note the kind of order six ways - capitals, initials such
as T/A and S/O, dotted abbreviations such as csh. and spec., words in brackets
- and an order that is not classed earns nothing, so a classifier that misses
one clerk's way of writing spoils that clerk's months and, through the credit
notes, other clerks' too. Leaving any one of the three least obvious hands
unread leaves at most 3 of 18 lines right.

The fact that decides the task is about the desks. The order book knows a
clerk only by the login of the terminal. 2 clerks changed desks at the
start of the quarter and worked all of it on each other's terminals, still
logged in, so the login-to-clerk list is wrong for both. Nothing records it and
the listed reading fails silently: every login still has a clerk and every
clerk a believable quarter, between the smallest and largest of the others. It
costs 6 of the 18 lines, where 2 may be wrong.
No figure shows it, because the two clerks' months are of ordinary size either
way. What shows it is the writing itself: each login's orders are in one hand
throughout, and the credit notes, which a clerk signs by name, show whose hand
each is. For four logins the hand is the listed clerk's; for two it is the
other's. The descriptions have to be read anyway to class the orders, and the
credit notes have to be read anyway to reckon the month, but nothing in the
reckoning ever sets a login's hand beside a signature.

tests/books_check.py measures all of this against the sealed figures and
refuses to pass otherwise: of 16 readings of the books the right one
gets 18 and the best other 12, against a bar of 16.
"""

solution_explanation = """
solution/pay_run.py reads only /app and writes /app/commission.csv with the
standard library. It recognises the six ways the kind of order is written and
classes every order. For each login it takes the hand most of its orders are
in, and for each clerk the hand most of his or her signed credit notes are in,
and gives a login's orders to the clerk who writes that hand, whatever the
login list says. Commission is the net value at the kind's rate, to the clerk
and month of the order; a credit note takes away its net value at the rate of
the order it is against, from the clerk who signed it, in the credit note's
month. In the task's own container it gets 18 of 18.
"""

verification_explanation = """
The verifier reads /app/commission.csv with the csv module and compares each
clerk-month with /tests/sealed.json, accepting fifty pence either way; at most
2 of the 18 lines may be wrong. None of the agent's code is
imported or run. The sealed figures exist only in the verifier image, /tests is
mode 700 there, and the agent's container never mounts it. Fifty pence covers
the rounding of several hundred products and nothing else: the two clerks who
changed desks differ by tens of pounds in every month, so the listed reading
gets none of their six lines right by chance. Nothing in the agent's container
attests any clerk's figure, no quarter total is shipped, and a sheet made on
the login list is as self-consistent as the right one. The reward is binary and
is written to /logs/verifier/reward.txt on every path; an empty container
scores 0 and the reference scores 1. The generator is seeded and shipped.
"""

category = "Operations"
subcategory = "Payroll Accounting"
tags = ["commission", "payroll", "text-classification", "data-cleaning", "python"]
expert_time_estimate_hours = 4
relevant_experience = """
Anyone who has done a merchant's quarter-end knows the counter terminal that is
never logged out, the clerk who writes everything in capitals and the one who
writes T/A for a trade account.
"""

