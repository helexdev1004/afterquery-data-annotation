artifacts = ["/app/service"]

[task]
name = "afterquery/ledger-rule-races"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"
difficulty_explanation = "This is the work of a backend or platform engineer on a payments or core-banking team: a transactional service is violating three of its own business rules under production load and has to be made correct without giving up the concurrency it was built for. The data is synthetic. Pools, accounts, opening balances and prior-day journal rows are all seeded by the verifier and the workload is generated from a seeded RNG, so no real customer data is involved; the shape of it, a double-entry journal with cached balances, a per-customer daily outbound cap, account closure and one-time reversal, is the standard arrangement in real ledgers. The difficulty is not that concurrent read-then-write is unsafe, which is common knowledge, because the shipped service already applies the remedy that knowledge produces: it locks both account rows with SELECT FOR UPDATE in ascending id order, which is correct, and which fully protects the cached balances. Three separate rules are nonetheless broken, in three different code paths, for three different reasons, and each needs a different repair. The daily cap is an aggregate over every entry belonging to the pool including rows that do not exist yet, so it is a predicate rather than a set of rows and two transfers out of different accounts of the same pool share nothing for a row lock to order. Reversal asks whether a reversal row exists and then inserts one, which is the same shape of defect in a different place and needs either the original journal rows locked or a uniqueness constraint. Closure reads the balance with the repository's plain read where that same repository's locking read is what the transfer path already uses, so the repair is to notice that one call site reached for the wrong one of two neighbouring functions. The service is laid out the way such a service really is, with routes in app/api, a module per use case in app/services, the rules in app/policy and every statement that touches the database in app/repositories, so no defect is visible from any one screen. Each is an absence rather than a wrong line: a condition nothing orders, a check made against a row nobody locked, a plain read standing where the locking one sits beside it. Finding them means reading the service rather than scanning a file, and because the correct primitives are present and correctly used elsewhere, a reader who greps for FOR UPDATE finds the transfer path already doing the right thing and has to work out what is missing rather than what is wrong. Nothing tells the solver how many faults there are, and the paths interact: a fix for one that widens a lock breaks the granularity requirement, and adding a third lock class without thinking about acquisition order reintroduces deadlocks. Two further constraints rule out the escapes: lock ordering is graded from the server's own deadlock counter rather than the client's view, so retrying a deadlock does not hide it, and lock granularity is graded by sampling the server's wait accounting while every client spends from its own pool, so serialising everything behind one lock is correct and still fails."
solution_explanation = "Three distinct repairs are needed and the reference solution applies all three while keeping one consistent lock order. For the daily cap, the failing check ranges over rows that are not yet written, so the pool row is taken with SELECT ... FOR UPDATE before the total is read, giving the predicate something concrete to serialise on; spending within a pool is ordered while different pools stay independent. Equivalent accepted routes are SERIALIZABLE isolation with a bounded retry on SQLSTATE 40001, and materialising the daily total into a per-pool-per-day counter row updated in the same transaction. For reversal, the check-then-insert against the reversals table is ordered by locking the original transfer's journal rows with ORDER BY account_id FOR UPDATE, so two reversals of the same transfer queue against each other; a unique index on reversals (transfer_id) with the conflict handled is an equally good repair. For closure, the account row is locked in the close path, and the transfer path rejects closed accounts under the row locks it already held, which is what makes the two paths agree. Lock order throughout is pool first, then account rows in ascending id order, and reversals touch their accounts in sorted order too; because a transaction takes at most one pool lock and takes it before any account lock, no cycle can form and the server's deadlock counter never moves. Measured, the reference solution is clean on every invariant across rounds, spends ninety-eight to ninety-nine percent of each pool's allowance, and leaves zero backends waiting on locks while unrelated pools transact."
verification_explanation = "The verifier runs in its own container and never shares state with the agent. It boots its own PostgreSQL, seeds pools, accounts, limits, empty accounts and prior-day journal rows itself so nothing about the data comes from the submission, and launches the service under an unprivileged account with a fixed entrypoint and worker count so the deployment shape cannot be altered. The database role is not a superuser and /logs/verifier is not writable by the account the service runs as, so nothing the submission leaves behind can reach the reward file; both the grader and the entry script sweep that account before the verdict is written. Grading runs up to six rounds, stopping at the first dirty one because the remaining rounds cannot change the verdict. Each round reseeds and drives three overlapping workloads from a fixed RNG seed, with the exact sizes taken from constants at the top of tests/grader.py: CONTENTION_TRANSFERS of 600 transfers at CONTENTION_CONCURRENCY of 16, drawn from two spending pools of ACCOUNTS_PER_POOL 24 accounts each with a POOL_DAILY_LIMIT of 200000 cents and amounts between 5000 and 20000, all paid into a separate 32-account sink pool; then REVERSAL_TARGETS of 40 of the accepted transfers each reversed by REVERSALS_PER_TRANSFER of 3 clients at once; then each of the 24 empty accounts in the close pool closed while a transfer is aimed at it. The 800-at-32 figures that appear in instruction.md are the suggested arguments for the agent's own stress tool and are deliberately heavier than the graded workload; they are not what the verifier runs. After each round the verifier queries the database directly and asserts that no pool spent more than its daily limit within the server's current day, that no closed account holds a balance, that no transfer was reversed more than once and every reversal wrote exactly two journal rows, that every account balance equals the sum of that account's entries, that no balance is negative, that money is conserved, and that every accepted movement wrote exactly its own rows while every rejected one wrote none. A request that received no response at all is treated as an unknown outcome: its rows are neither required nor forbidden, since the server may have committed before the connection was lost, while every other invariant still applies to it. Measured over repeated runs of three and four rounds per variant, the shipped service is dirty in every round, with pools over by thousands to tens of thousands of cents, transfers reversed twice and closed accounts still holding money, while the reference solution is clean in every round with zero 5xx responses. Lock ordering is read two ways. The server's own log is scanned for every deadlock it reported during the graded rounds, and pg_stat_database.deadlocks is compared before and after; the log is what the verdict rests on, because the counter can be zeroed with pg_stat_reset() whereas the log lives under a directory the account the service runs as cannot write. The statistics reset timestamp is compared before and after as well, so a service that launders the counter rather than fixing its lock order fails on that alone. Granularity is measured by sampling pg_stat_activity every twenty milliseconds while thirty-two clients each spend from their own pool into their own destination pool, where nothing shares an account or a pool; fewer than ten percent of active samples may show three or more backends waiting on a lock, which the reference solution satisfies at zero percent with no backend ever blocked, while the same solution wrapped in a global advisory lock fails it at between ninety-five and one hundred percent with peaks of around thirty blocked backends. That sampler only sees a backend parked on a database lock, so on its own it is blind to a gate that is not one: a service that funnels every request through an in-process lock or a file lock makes its callers queue where the server cannot see them. A second check asks the question causally instead. One account is pinned under a row lock taken from outside the service, and while the transfer drawing on that account is parked, a transfer on a pool sharing neither an account nor a pool with it must still answer within five seconds; the reference answers in about five hundredths of a second, so the separation needs no hardware constant. A utilisation floor requires each spending pool to get at least sixty percent of its daily allowance through, which blocks the degenerate fix of refusing traffic; the reference solution reaches ninety-eight to ninety-nine percent. Separately from the concurrent rounds, a sealed single-threaded pass in functional_checks asserts the API contract every instruction bullet names, so that a service which satisfies the invariants by refusing to do the work is caught: health, the account and pool reads including an unknown account and an unknown pool, an accepted transfer debiting and crediting and writing its two journal rows, the daily cap at its boundary from under it to exactly on it to over it with the rejected attempt writing nothing, insufficient funds, same source and destination, unknown destination and a non-positive amount, then a reversal that is accepted and restores both balances and writes exactly two mirrored rows and records itself once, a second reversal of the same transfer refused, a reversal of an unknown transfer refused, then a funded account that cannot be closed and stays open, an empty account that closes and afterwards reports itself closed, a closed account refusing money in and out with nothing written and its balance untouched, closing an already closed account being idempotent, and closing an unknown account refused. Whether a reversal frees the day's allowance again is deliberately not asserted anywhere, because the instruction does not say either way and grading it would invent a rule the solver was never given. These checks belong to the verifier, so editing the copy of the suite that ships in environment/service/regression achieves nothing. Every correctness comparison is exact integer arithmetic on minor units, with no floating point tolerance and no timing threshold anywhere. Two clocks do appear and neither decides correctness: the daily cap is cut on the server's calendar day, which the service and the verifier read from the same database, and a round that crosses midnight is detected by comparing current_date before and after and is simply taken again; and each round carries a 180 second wall-clock budget that stops it issuing new work, which exists so that a solution deadlocking and retrying cannot run for hours, and which a correct solution never approaches because a round completes in seconds."
category = "Software"
subcategory = "Databases"
tags = ["concurrency", "databases", "postgresql", "debugging", "transactions"]
expert_time_estimate_hours = 6
relevant_experience = "I am a senior full-stack developer and most of my work sits on the server side of web applications: designing PostgreSQL schemas, writing transactional business logic over them, and being the person who gets called when a service that takes concurrent traffic starts producing numbers that do not add up. Debugging is the part of the job I have done most of, and intermittent data-integrity failures are the category I have spent the most time on - totals that drift, code that is provably correct read top to bottom and wrong the moment two requests overlap, defects that never reproduce until a load generator is pointed at them. I built this task around business rules rather than a plain lost update because the plain lost update is the one every engineer already knows how to fix. The failures I have actually shipped were the ones where the row locking looked right and simply did not cover the rule being enforced, and where fixing the obvious one left two more sitting in code paths nobody thought to re-read."

