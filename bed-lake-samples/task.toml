relevant_experience = """
Anyone who has worked a core repository will know the shape of this. The note
covers the ordinary case and the sample book is what five curators made it:
millimetres, inches, depth down the hole where a place along the section was
wanted, the volume written first. Tying samples back to beds is the classic
instance - the bed log and the sample book both run from a section's labelled
top, the papers count beds down the hole, and a section comes out of the barrel
with nothing but a marker pen to say which end was up. Knowing that a graded
flood layer fines upward, and that a section whose beds all coarsen upward has
been labelled the wrong way round, is ordinary knowledge for anyone who has
logged core.
"""

