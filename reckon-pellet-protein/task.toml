[task]
name = "afterquery/reckon-pellet-protein"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Tying a pellet sample back to the ration it was pressed from, and saying what
protein it should therefore have had, is routine work for a feed mill's quality
technician or nutritionist; it is done whenever a lab result looks off
specification, from exactly what ships here - the routing table, the batching
system's bin bookings, the press loggers, the formulas and the ingredient
assays. The data is synthetic and was made truth first: three days of milling
were run on one clock, 79 changes of formula across five bins and
119156 ten-second lines of pressing, every press drawing from the bin it is
really connected to, and each of the 40 samples was given its formula and
its protein from that. Only then were the records written, the routing table as
the office believes it and each press log in its own logger's notation. The
figures are exact by construction and the records are static, so nothing is
computed at marking time.

The mill's note states every rule the marking uses, down to how a dry-matter
assay is brought to an as-fed one. Applied to the records on paper it gets
0 of 40: four loggers keep a log the note does not describe - one
counts kilograms, one pounds, one writes what was pressed in each ten seconds
and not the running total, one writes seconds since its log began and not the
time of day. Each is glaring, each is a notation and nothing more, and leaving
any one alone costs eight samples against an allowance of 4.

What decides the task is the plumbing. For 2 of the 5 presses
the routing table is wrong: a diverter was left over after a repair and each of
the two has been running off the other's bin, one of them a press with an odd
logger and one the press logged exactly as the note says. Nothing in the
records says so, and the table's own reading fails silently - a bin always
holds some formula, so every sample still gets a formula and a protein - at a
cost of 16 of the 40. No first-order figure shows it. A press
is fed at a set rate whatever the ration, and its mean rate differs between
formulas by no more than 5.3 in a hundred whichever bin it is set
against; a bin is changed over on the run, so no stoppage marks a change;
stoppages fall at random and no two logs begin together. What a ration does
leave is second order and local: some rations pellet sweetly and some raggedly,
so how far one ten seconds' pressing stands from the ten seconds either side of
it steps up or down when the bin the press is really drawing from changes
formula. Compared over the twenty-five minutes before and after each change,
that step averages at least 0.80 in log ratio at the changes of a press's
true bin, and at most 0.35 at the changes of any other. The press's own
slow wander and its odd minute of fuss at the feeder are larger than the effect
itself, so a table of rate and spread by formula shows nothing.

tests/mill_proof.py measures all of this against the sealed figures and refuses
to pass otherwise: of the 32 combinations of readings the facts get
40, the best other gets 32 against a bar of 36, and the commonest
single answer 6.
"""

solution_explanation = """
solution/expected.py, with solution/millrules.py, reads only /app and writes
/app/expected_protein.csv with the standard library alone. It tells each
logger's notation from the log itself - no colons in the times, figures that
fall as well as rise, a last reading a thousand or two thousand times the
counter readings the samples were tagged with - and puts it right. For every
press it takes how far each ten seconds' pressing stands from the mean of the
ten seconds either side, leaving stoppages out, and for each of the five bins
compares the middle value over the twenty-five minutes after each change of
formula with the twenty-five minutes before; the bin whose changes the press's
steadiness answers to is the bin it draws from. It then finds when the press's
counter stood at each sample's reading, takes the formula that bin held then,
and reckons the formula's as-fed protein from its inclusions and the assays.
Run in the task's own container it gets 40 of 40.
"""

verification_explanation = """
The verifier reads /app/expected_protein.csv as text with the csv module and
compares each sample's formula, as a string, and its protein, within 0.05, with
the sealed figures in /tests/sealed.json; at most 4 of the 40
may be out. Nothing the agent wrote is imported or executed. The sealed figures
exist only in the verifier image, /tests is mode 700 there, and the agent's
container never mounts it. Every sample was caught at least a quarter of an
hour from any change of formula in either the bin its press really draws from
or the bin the table gives it, so no answer turns on a minute; the fourteen
formulas' proteins all differ by far more than the 0.05 allowed for rounding;
and no sample comes out right by the accident of a log left in its own
notation. Nothing in the agent's container attests any sample's formula, no
total has to balance, and a wrong sheet is as self-consistent as the right one.
The reward is binary and is written to /logs/verifier/reward.txt on every path;
an empty container scores 0 and the reference scores 1. The generator is seeded
and shipped.
"""

category = "Operations"
subcategory = "Feed Milling"
tags = ["feed-milling", "traceability", "machine-logs", "data-cleaning", "python"]
expert_time_estimate_hours = 5
relevant_experience = """
A feed mill's quality manager will recognise every part of it: loggers bought
at different times that count in different things, a routing table nobody
updated after the fitters had the diverter apart, and the way a fibrous ration
makes a press run unevenly where a starchy one runs sweet.
"""

