expert_time_estimate_hours = 7
relevant_experience = """
Anyone who has had to take over somebody else's survey will know the shape of
this. The standing instructions cover the ordinary case and the records are what
they are: a gauge that was stopped off midway, a level book on a datum nobody
carried forward, a tracer run that caught a storm. Drainage connection surveys
are the classic instance - a borough inheriting private drains has to prove
where each one goes from levels, gauged flows and dye, and the flows are what
tie the answer together because a chamber reads everything above it. Reading a
level book against a datum, knowing that a sewer surcharges in storm and that
what is in a full sewer does not keep to the fall of the pipe, is ordinary work
for anyone who has worked a drainage record.
"""

